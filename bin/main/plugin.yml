name: PAC
version: "${version}"
main: org.pexserver.pac.PacPlugin
api-version: "26.3"
author: PEX
description: PEX Anti Cheat
depend: [packetevents]
softdepend: [floodgate]
loadbefore: [Geyser-Spigot]
commands:
  pac:
    description: PAC administration
    usage: /pac <help|ui|debug|alerts|bypass|detector|ground|settings|ban|unban|banlist|support|history|reload>
permissions:
  pac.admin:
    default: op
    children:
      pac.alerts: true
      pac.ui: true
      pac.debug: true
      pac.bypass: true
      pac.detector: true
      pac.ground: true
      pac.settings: true
      pac.ban: true
      pac.unban: true
      pac.banlist: true
      pac.support: true
      pac.history: true
      pac.reload: true
  pac.alerts: { default: op }
  pac.ui: { default: op }
  pac.debug: { default: op }
  pac.bypass: { default: op }
  pac.detector: { default: op }
  pac.ground: { default: op }
  pac.settings: { default: op }
  pac.ban: { default: op }
  pac.unban: { default: op }
  pac.banlist: { default: op }
  pac.support: { default: op }
  pac.history: { default: op }
  pac.reload: { default: op }
